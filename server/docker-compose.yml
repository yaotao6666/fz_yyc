version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: fz_yyc_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: fz_yyc_api
      MYSQL_USER: fz_yyc
      MYSQL_PASSWORD: fz_yyc123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fz_yyc_network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: fz_yyc_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass redis123
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fz_yyc_network

  # 后端 API 服务
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fz_yyc_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: fz_yyc
      DB_PASSWORD: fz_yyc123
      DB_NAME: fz_yyc_api
      DB_CHARSET: utf8mb4
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      REDIS_DB: 0
      JWT_SECRET: default-secret-change-in-production
      JWT_EXPIRE: 720
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      APP_ENV: development
      APP_DEBUG: "true"
      WECHAT_APP_ID: wx684960f1efea2738
      WECHAT_APP_SECRET: 6f6b3ad2f1fe3f5129bd1b320993d51a
      QINIU_ACCESS_KEY: 1FctZeFOq4pUyZ55WhkfyzU9rI31anReup9lHbkF
      QINIU_SECRET_KEY: 9jzDbPHC06UvA0HyXnNkZiHy_yEZjdUbKChQeBHY
      QINIU_BUCKET: xm-lexiang
      QINIU_DOMAIN: https://lexiang-oss.jxxme.cn
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fz_yyc_network

networks:
  fz_yyc_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
